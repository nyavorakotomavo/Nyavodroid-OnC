name: Auto-post Nyavodroid — Story

on:
  schedule:
    - cron: "0 7 * * 1-6"      # 7h UTC
    - cron: "30 9 * * 1-6"      # 9h30 UTC
    - cron: "0 17 * * 0,1-6"    # 17h UTC (dimanche inclus)
  workflow_dispatch: {}

jobs:
  story:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dépendances système
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Dépendances Python
        run: pip install "requests>=2.31.0"

      - name: Publier la story
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          GEMINI_API_KEY_STORY: ${{ secrets.GEMINI_API_KEY_STORY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FAL_API_KEY: ${{ secrets.FAL_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FREEAI_API_KEY: ${{ secrets.FREEAI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python post_story.py
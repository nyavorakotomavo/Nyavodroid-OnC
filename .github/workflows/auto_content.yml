name: Auto-post Nyavodroid — Multi-formats

on:
  schedule:
    - cron: "0 7 * * 1-6"      # 7h UTC → Post Texte seul (image fond Pillow)
    - cron: "30 9 * * 1-6"      # 9h30 UTC → Post Image + Texte
    - cron: "0 17 * * 0,1-6"    # 17h UTC → Reel vidéo (dimanche inclus)
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dépendances système
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Dépendances Python
        run: pip install "requests>=2.31.0" "Pillow>=10.0.0"

      - name: Publier le contenu
        env:
            # ──────────────────────────────────────────────
# Secrets
# ──────────────────────────────────────────────
FB_PAGE_ID = clean(os.environ.get("FB_PAGE_ID", ""))
FB_PAGE_ACCESS_TOKEN = clean(os.environ.get("FB_PAGE_ACCESS_TOKEN", ""))
MISTRAL_API_KEY = clean(os.environ.get("MISTRAL_API_KEY", ""))
TOGETHER_API_KEY = clean(os.environ.get("TOGETHER_API_KEY", ""))
HF_TOKEN = clean(os.environ.get("HF_TOKEN", ""))
REPLICATE_API_TOKEN = clean(os.environ.get("REPLICATE_API_TOKEN", ""))
FAL_API_KEY = clean(os.environ.get("FAL_API_KEY", ""))
CLOUDFLARE_ACCOUNT_ID = clean(os.environ.get("CLOUDFLARE_ACCOUNT_ID", ""))
CLOUDFLARE_API_TOKEN = clean(os.environ.get("CLOUDFLARE_API_TOKEN", ""))
FREEAI_API_KEY = clean(os.environ.get("FREEAI_API_KEY", ""))
PEXELS_API_KEY = clean(os.environ.get("PEXELS_API_KEY", ""))

# ── Multi-comptes Cloudflare (répartition de charge anti-quota) ──
CLOUDFLARE_CREDS = []
for _suffix in ("", "_2", "_3"):
    _acc = clean(os.environ.get(f"CLOUDFLARE_ACCOUNT_ID{_suffix}", ""))
    _tok = clean(os.environ.get(f"CLOUDFLARE_API_TOKEN{_suffix}", ""))
    if _acc and _tok:
        CLOUDFLARE_CREDS.append((_acc, _tok))
_CF_INDEX = 0
        run: python post_content.py
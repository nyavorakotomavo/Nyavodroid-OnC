name: VoyageMadagascar Auto-Publish

on:
  schedule:
    - cron: "0 4,11,17 * * *"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core ffmpeg imagemagick

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Create required directories
        run: |
          mkdir -p defaults templates
          if [ ! -f "defaults/voyage_default.jpg" ]; then
            convert -size 1080x1080 xc:skyblue -fill white -pointsize 40 -draw "text 100,540 'VoyageMadagascar'" -draw "text 100,600 'Decouvrez Madagascar'" defaults/voyage_default.jpg
          fi

      - name: Publish VoyageMadagascar Content
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: |
          python post_voyage.py --content-type travel_guide --auto-publish true
          python post_voyage.py --content-type destination_highlight --auto-publish true
          python post_voyage.py --content-type travel_tip --auto-publish true

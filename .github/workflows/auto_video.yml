name: Auto Video (quotidien 17:00 UTC)

on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow edge-tts
      
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      
      - name: Phase 1 — Script generation
        env:
          GEMINI_API_KEY_CONTENT: ${{ secrets.GEMINI_API_KEY_CONTENT }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: python video_pipeline/01_script.py
      
      - name: Phase 2 — Voice generation
        run: python video_pipeline/02_voice.py
      
      - name: Phase 3 — Scene analysis
        env:
          GEMINI_API_KEY_CONTENT: ${{ secrets.GEMINI_API_KEY_CONTENT }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: python video_pipeline/03_analyze.py
      
      - name: Phase 4 — Visuals
        env:
          GEMINI_API_KEY_CONTENT: ${{ secrets.GEMINI_API_KEY_CONTENT }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python video_pipeline/04_visuals.py
      
      - name: Phase 5 — Animation
        run: python video_pipeline/05_animate.py
      
      - name: Phase 6 — Audio mixing
        run: python video_pipeline/06_audio.py
      
      - name: Phase 7 — Final assembly
        run: python video_pipeline/07_editor.py
      
      - name: Publish to Facebook
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: python video_pipeline/publish_video.py
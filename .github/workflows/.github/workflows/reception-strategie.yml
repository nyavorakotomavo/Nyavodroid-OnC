name: Réception et application de la stratégie

on:
  repository_dispatch:
    types:
      - nouvelle_strategie
  schedule:
    # Fallback : exécution quotidienne à 9h UTC si aucun dispatch n'est reçu
    - cron: "0 9 * * *"
  workflow_dispatch:

timeout-minutes: 15

jobs:
  application-strategie:
    name: Appliquer la stratégie de publication
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Récupérer le code
        uses: actions/checkout@v4

      - name: 🐍 Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🎯 Charger et valider la stratégie
        id: charger_strategie
        env:
          STRATEGIE_JSON: ${{ toJSON(github.event.client_payload) }}
        run: |
          python -c "
          from charger_strategie import charger_strategie
          import json
          strategie = charger_strategie()
          print(f'Strategie chargee avec succes')
          print(f'Heure: {strategie.meilleure_heure}')
          print(f'Format: {strategie.format_prefere}')
          "

      - name: 🚀 Exécuter le script de publication
        env:
          STRATEGIE_JSON: ${{ toJSON(github.event.client_payload) }}
          # Ajoute ici tes autres secrets (tokens de publication, etc.)
        run: |
          echo "Lancement du script de publication avec la stratégie NAnaly..."
          python ton_script_de_publication.py
        timeout-minutes: 10

      - name: 📊 Résumé de l'exécution
        if: always()
        run: |
          echo "=========================================="
          echo "RÉSUMÉ DE L'EXÉCUTION"
          echo "=========================================="
          echo "Trigger : ${{ github.event_name }}"
          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            echo "Stratégie reçue de : NAnaly"
            echo "Event type : ${{ github.event.action }}"
          else
            echo "Exécution fallback (cron)"
          fi
          echo "=========================================="
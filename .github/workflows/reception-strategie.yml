name: 🧠 Stratégie NAnaly

on:
  repository_dispatch:
    types:
      - nouvelle_strategie
  schedule:
    - cron: "0 7 * * *"
    - cron: "0 9 * * *"
    - cron: "0 17 * * *"
  workflow_dispatch:

jobs:
  application-strategie:
    name: Appliquer la stratégie
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🎯 Charger stratégie
        env:
          STRATEGIE_JSON: ${{ toJSON(github.event.client_payload) }}
        run: |
          python -c "
          import os, json
          from charger_strategie import charger_strategie
          s = charger_strategie()
          print(f'✅ Stratégie: {s.source} | Heure: {s.meilleure_heure} | Format: {s.format_prefere}')
          "

      - name: 🕒 Choisir script
        id: script
        run: |
          HOUR=$(date -u +%H)
          if [ "$HOUR" -ge 6 ] && [ "$HOUR" -lt 8 ]; then
            echo "target=post_story.py" >> $GITHUB_OUTPUT
          else
            echo "target=post_content.py" >> $GITHUB_OUTPUT
          fi

      - name: 🚀 Exécuter publication
        env:
          STRATEGIE_JSON: ${{ toJSON(github.event.client_payload) }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          GEMINI_API_KEY_CONTENT: ${{ secrets.GEMINI_API_KEY_CONTENT }}
          GEMINI_API_KEY_STORY: ${{ secrets.GEMINI_API_KEY_STORY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          # Ajoute les autres secrets si nécessaire
        run: python ${{ steps.script.outputs.target }}
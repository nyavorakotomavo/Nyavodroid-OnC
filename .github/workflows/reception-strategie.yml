name: Strategie NAnaly

on:
  repository_dispatch:
    types:
      - nouvelle_strategie
  schedule:
    - cron: "0 7 * * *"
    - cron: "0 9 * * *"
    - cron: "0 17 * * *"
  workflow_dispatch:

jobs:
  run_publication:
    name: Publication Auto
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Charger strategie
        env:
          STRATEGIE_JSON: ${{ toJSON(github.event.client_payload) }}
        run: |
          python -c "from charger_strategie import charger_strategie; s=charger_strategie(); print(f'OK: {s.source}')"

      - name: Choisir script
        id: select_script
        run: |
          HOUR=$(date -u +%H)
          if [ "$HOUR" -ge 6 ] && [ "$HOUR" -lt 8 ]; then
            echo "target=post_story.py" >> $GITHUB_OUTPUT
          else
            echo "target=post_content.py" >> $GITHUB_OUTPUT
          fi

      - name: Executer publication
        env:
          STRATEGIE_JSON: ${{ toJSON(github.event.client_payload) }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          GEMINI_API_KEY_CONTENT: ${{ secrets.GEMINI_API_KEY_CONTENT }}
          GEMINI_API_KEY_STORY: ${{ secrets.GEMINI_API_KEY_STORY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FAL_API_KEY: ${{ secrets.FAL_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID_2: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_2 }}
          CLOUDFLARE_API_TOKEN_2: ${{ secrets.CLOUDFLARE_API_TOKEN_2 }}
          CLOUDFLARE_ACCOUNT_ID_3: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_3 }}
          CLOUDFLARE_API_TOKEN_3: ${{ secrets.CLOUDFLARE_API_TOKEN_3 }}
          FREEAI_API_KEY: ${{ secrets.FREEAI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: python ${{ steps.select_script.outputs.target }}
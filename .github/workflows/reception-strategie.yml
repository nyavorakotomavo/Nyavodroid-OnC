name: Cerveau NAnaly

on:
  repository_dispatch:
    types:
      - nouvelle_strategie
  schedule:
    - cron: "0 7 * * *"
    - cron: "0 9 * * *"
    - cron: "0 17 * * *"
  workflow_dispatch:

timeout-minutes: 15

jobs:
  application-strategie:
    name: Appliquer la strategie
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Charger la strategie
        env:
          STRATEGIE_JSON: ${{ toJSON(github.event.client_payload) }}
        run: python -c "from charger_strategie import charger_strategie; s = charger_strategie(); print(f'OK: {s.source}')"

      - name: Lancer la publication
        env:
          STRATEGIE_JSON: ${{ toJSON(github.event.client_payload) }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          GEMINI_API_KEY_CONTENT: ${{ secrets.GEMINI_API_KEY_CONTENT }}
          GEMINI_API_KEY_STORY: ${{ secrets.GEMINI_API_KEY_STORY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          FAL_API_KEY: ${{ secrets.FAL_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FREEAI_API_KEY: ${{ secrets.FREEAI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          HOUR=$(date -u +%H)
          if [ "$HOUR" -ge 6 ] && [ "$HOUR" -lt 8 ]; then
            python post_story.py
          else
            python post_content.py
          fi
        timeout-minutes: 10
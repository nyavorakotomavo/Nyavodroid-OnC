name:Réception et application de la stratégie

on:
  repository_dispatch:
    types:
      - nouvelle_strategie
  schedule:
    - cron: "0 7 * * *"   # 07h UTC → texte_seul
    - cron: "0 9 * * *"   # 09h UTC → image_texte
    - cron: "0 17 * * *"  # 17h UTC → image_texte (ex-Reel)
  workflow_dispatch:

timeout-minutes: 15

jobs:
  application-strategie:
    name: Appliquer la stratégie de publication
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupérer le code
        uses: actions/checkout@v4

      - name: 🐍 Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🎯 Charger et valider la stratégie
        id: charger_strategie
        env:
          STRATEGIE_JSON: ${{ toJSON(github.event.client_payload) }}
        run: |
          python -c "
          from charger_strategie import charger_strategie
          import json, os
          strategie = charger_strategie()
          print(f'✅ Stratégie chargée : {strategie.source}')
          print(f'   Heure optimale : {strategie.meilleure_heure}')
          print(f'   Format : {strategie.format_prefere}')
          print(f'   Mots-clés : {len(strategie.mots_cles_tendance)}')
          print(f'   Sujets : {len(strategie.sujets_a_explorer)}')
          # Export pour les étapes suivantes
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'source={strategie.source}\n')
          "

      - name:  Déterminer le script à lancer
        id: choisir_script
        run: |
          HOUR=$(date -u +%H)
          if [ "$HOUR" -ge 6 ] && [ "$HOUR" -lt 8 ]; then
            echo "script=post_story.py" >> $GITHUB_OUTPUT
            echo "📌 Story (06-08h UTC)"
          elif [ "$HOUR" -ge 8 ] && [ "$HOUR" -lt 12 ]; then
            echo "script=post_content.py" >> $GITHUB_OUTPUT
            echo "📌 Content (08-12h UTC)"
          else
            echo "script=post_content.py" >> $GITHUB_OUTPUT
            echo "📌 Content (fallback)"
          fi

      - name: 🚀 Exécuter le script de publication
        env:
          STRATEGIE_JSON: ${{ toJSON(github.event.client_payload) }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          GEMINI_API_KEY_CONTENT: ${{ secrets.GEMINI_API_KEY_CONTENT }}
          GEMINI_API_KEY_STORY: ${{ secrets.GEMINI_API_KEY_STORY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          FAL_API_KEY: ${{ secrets.FAL_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FREEAI_API_KEY: ${{ secrets.FREEAI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          echo "🚀 Lancement de ${{ steps.choisir_script.outputs.script }} avec stratégie NAnaly..."
          python ${{ steps.choisir_script.outputs.script }}
        timeout-minutes: 10

      - name: 📊 Résumé de l'exécution
        if: always()
        run: |
          echo "=========================================="
          echo "RÉSUMÉ DE L'EXÉCUTION"
          echo "=========================================="
          echo "Trigger : ${{ github.event_name }}"
          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            echo "📡 Stratégie reçue de : NAnaly"
            echo "   Event type : ${{ github.event.action }}"
          else
            echo "⏰ Exécution fallback (cron)"
          fi
          echo "Script lancé : ${{ steps.choisir_script.outputs.script }}"
          echo "=========================================="
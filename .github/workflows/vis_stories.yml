name: VIS — Stories (horaire décalé)
on:
  schedule:
    # Décalé de +5h et +4h par rapport aux posts
    - cron: "0 12 * * *"
    - cron: "0 21 * * *"
  workflow_dispatch:
jobs:
  publier:
    runs-on: ubuntu-latest
    env:
      BRAND: vis
      FB_PAGE_ID: ${{ secrets.VIS_FB_PAGE_ID }}
      FB_PAGE_ACCESS_TOKEN: ${{ secrets.VIS_FB_PAGE_TOKEN }}
      GEMINI_API_KEY_CONTENT: ${{ secrets.GEMINI_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VIS_FORCE_PILIER: story
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Dépendances
        run: pip install -r requirements.txt
      - name: Polices
        run: |
          [ -f assets/fonts/Inter-Bold.ttf ] || python download_fonts.py
          python download_fonts_vis.py
      - name: Story VIS uniquement
        run: python post_vis.py

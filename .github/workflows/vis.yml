name: VIS — Publication paraboles & leçons brunes
on:
  schedule:
    # Paraboles (50%) : lundi, mercredi, vendredi à 7h UTC
    - cron: "0 7 * * 1,3,5"
    # Morale ou Question (50%) : mardi, jeudi, samedi, dimanche à 17h UTC
    - cron: "0 17 * * 0,2,4,6"
  workflow_dispatch:  # bouton "Run workflow" pour tester

jobs:
  publier:
    runs-on: ubuntu-latest
    env:
      BRAND: vis
      FB_PAGE_ID: ${{ secrets.VIS_FB_PAGE_ID }}
      FB_PAGE_ACCESS_TOKEN: ${{ secrets.VIS_FB_PAGE_TOKEN }}
      GEMINI_API_KEY_CONTENT: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer dépendances
        run: pip install -r requirements.txt

      - name: Télécharger polices VIS (Inter + Nunito)
        run: python download_fonts_vis.py

      - name: Publier post VIS (parabole / morale / question)
        run: python post_vis.py

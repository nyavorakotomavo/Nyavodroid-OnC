name: VIS — Publication paraboles & leçons brunes
on:
  schedule:
    - cron: "0 7 * * 1,3,5"
    - cron: "0 17 * * 0,2,4,6"
  workflow_dispatch:

jobs:
  publier:
    runs-on: ubuntu-latest
    env:
      BRAND: vis
      FB_PAGE_ID: ${{ secrets.VIS_FB_PAGE_ID }}
      FB_PAGE_ACCESS_TOKEN: ${{ secrets.VIS_FB_PAGE_TOKEN }}
      GEMINI_API_KEY_CONTENT: ${{ secrets.GEMINI_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer dépendances + ffmpeg
        run: |
          pip install -r requirements.txt
          sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Polices (Inter si absent + Nunito)
        run: |
          [ -f assets/fonts/Inter-Bold.ttf ] || python download_fonts.py
          python download_fonts_vis.py
      - name: Publier post VIS (Cloudflare prioritaire)
        run: python post_vis.py

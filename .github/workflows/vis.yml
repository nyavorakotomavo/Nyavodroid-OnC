name: VIS — Posts (parabole / morale / question)
on:
  schedule:
    - cron: "0 7 * * 1,3,5"
    - cron: "0 17 * * 0,2,4,6"
  workflow_dispatch:
    inputs:
      pilier:
        description: "Type de publication"
        type: choice
        default: aleatoire
        options: [aleatoire, parabole, morale, question, story]
permissions:
  contents: write
jobs:
  publier:
    runs-on: ubuntu-latest
    env:
      BRAND: vis
      VIS_EXCLUDE: story
      VIS_FORCE_PILIER: ${{ github.event.inputs.pilier }}
      FB_PAGE_ID: ${{ secrets.VIS_FB_PAGE_ID }}
      FB_PAGE_ACCESS_TOKEN: ${{ secrets.VIS_FB_PAGE_TOKEN }}
      GEMINI_API_KEY_CONTENT: ${{ secrets.GEMINI_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Identité git (auto-commit historique)
        run: |
          git config --global user.name "vis-bot"
          git config --global user.email "vis-bot@users.noreply.github.com"
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Dépendances + ffmpeg
        run: |
          pip install -r requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Polices
        run: |
          [ -f assets/fonts/Inter-Bold.ttf ] || python download_fonts.py
      - name: Post VIS
        run: python post_vis.py

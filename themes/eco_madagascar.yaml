name: EcoMadagascar

# ============================================
# META
# ============================================
description: "Page dédiée à l'écologie, la biodiversité et le développement durable à Madagascar."
theme_color: "#2E8B57"
secondary_color: "#3CB371"
accent_color: "#F5F5DC"
background_color: "#FFFFFF"

# ============================================
# BRANDING
# ============================================
brand_name: "EcoMadagascar"
brand_tagline: "Protégeons notre île, préservons notre avenir"
brand_hashtags: ["#EcoMadagascar", "#MadagascarVert", "#Biodiversité", "#DéveloppementDurable"]

# ============================================
# CONTENT CONFIG
# ============================================
content_types:
  - type: "article"
    weight: 40
    description: "Articles éducatifs sur l'écologie malgache"
    min_length: 200
    max_length: 1000
    required_tags: ["écologie", "Madagascar"]
    
  - type: "infographic"
    weight: 30
    description: "Infographies sur la biodiversité"
    image_source: "pexels"
    required_keywords: ["nature", "animal", "plante", "forêt"]
    
  - type: "story"
    weight: 20
    description: "Histoires inspirantes de protection environnementale"
    min_slides: 5
    max_slides: 10
    
  - type: "video"
    weight: 10
    description: "Vidéos courtes sur des initiatives écologiques"
    duration_min: 30
    duration_max: 120

# ============================================
# VISUAL STYLE
# ============================================
font:
  primary: "DejaVuSans"
  secondary: "DejaVuSerif"
  size:
    title: 24
    subtitle: 18
    body: 14
    caption: 12

image_style:
  quality: 90
  width: 1080
  height: 1080
  format: "JPEG"
  watermark: true
  watermark_text: "@EcoMadagascar"
  watermark_position: "bottom_right"
  watermark_opacity: 0.7

video_style:
  resolution: "1080p"
  fps: 30
  format: "MP4"
  codec: "libx264"

colors:
  primary_text: "#1F4E2E"
  secondary_text: "#3A5F4D"
  background: "#F8F9FA"
  highlight: "#FFD700"

# ============================================
# SOCIAL MEDIA
# ============================================
social:
  facebook:
    enabled: true
    page_id: "EcoMadagascarOfficial"
    auto_publish: true
    schedule:
      - time: "08:00"
        timezone: "Indian/Antananarivo"
        content_type: "article"
      - time: "12:00"
        timezone: "Indian/Antananarivo"
        content_type: "infographic"
      - time: "18:00"
        timezone: "Indian/Antananarivo"
        content_type: "story"

# ============================================
# AI GENERATION
# ============================================
ai:
  image_prompt:
    style: "photorealistic"
    model: "dall-e-3"
    negative_prompt: "blurry, low quality, watermark, text, logo"
    
  text_prompt:
    model: "gpt-4"
    temperature: 0.7
    max_tokens: 2000
    tone: "educative"
    language: "fr"
    
  voice:
    model: "tts-1"
    voice_type: "female"
    language: "fr"
    speed: 1.0

# ============================================
# CONTENT SOURCES
# ============================================
sources:
  images:
    - provider: "pexels"
      api_key: "PEXELS_API_KEY"
      query_keywords: ["Madagascar nature", "lemur", "baobab", "rainforest", "beach"]
      
    - provider: "unsplash"
      api_key: "UNSPLASH_API_KEY"
      query_keywords: ["ecology", "sustainability", "wildlife"]
  
  text:
    - provider: "internal"
      database: "eco_articles.json"
    
    - provider: "rss"
      feeds:
        - "https://www.mongabay.com/fr/feed/"
        - "https://www.nationalgeographic.fr/flux/rss/environnement.xml"

# ============================================
# VIDEO PIPELINE
# ============================================
video_pipeline:
  steps:
    - name: "voice_generation"
      script: "02_voice.py"
      enabled: true
      
    - name: "animation"
      script: "05_animate.py"
      enabled: true
      transition: "fade"
      duration_per_slide: 4
      
    - name: "audio_mixing"
      script: "06_audio.py"
      enabled: true
      background_music: "BACKGROUND_MUSIC_PATH"
      music_volume: 0.3
      
    - name: "video_editing"
      script: "07_editor.py"
      enabled: true
      intro_template: "templates/intro_eco.mp4"
      outro_template: "templates/outro_eco.mp4"
      
    - name: "quality_check"
      script: "08_qc.py"
      enabled: true
      checks:
        - "audio_levels"
        - "visual_quality"
        - "duration"

# ============================================
# FALLBACK CONFIG
# ============================================
fallback:
  image: "defaults/eco_default.jpg"
  text: "Découvrez la beauté de Madagascar et l'importance de la protection de notre environnement."
  hashtags: ["#EcoMadagascar", "#Nature", "#Protection"]

# ============================================
# METADATA
# ============================================
metadata:
  version: "1.0.0"
  author: "Nyavo"
  created: "2026-08-23"
  compatible_with: ["OnC v2.0+"]

name: VoyageMadagascar

# ============================================
# META
# ============================================
description: "Page dediee aux voyages, decouvertes et merveilles de Madagascar."
theme_color: "#4682B4"
secondary_color: "#5F9EA0"
accent_color: "#FFD700"
background_color: "#FFFFFF"

# ============================================
# BRANDING
# ============================================
brand_name: "VoyageMadagascar"
brand_tagline: "Decouvrez les tresors caches de la Grande Ile"
brand_hashtags: ["#VoyageMadagascar", "#DecouvrirMadagascar", "#Aventure", "#Tourisme"]

# ============================================
# CONTENT CONFIG
# ============================================
content_types:
  - type: "travel_guide"
    weight: 50
    description: "Guides de voyage et itineraires a Madagascar"
    min_length: 300
    max_length: 1500
    required_tags: ["voyage", "Madagascar", "itinerary"]
    
  - type: "destination_highlight"
    weight: 30
    description: "Mise en avant de destinations malgaches"
    image_source: "pexels"
    required_keywords: ["beach", "mountain", "forest", "city", "Madagascar"]
    
  - type: "travel_tip"
    weight: 20
    description: "Conseils pratiques pour voyager a Madagascar"
    min_length: 100
    max_length: 500

# ============================================
# VISUAL STYLE
# ============================================
font:
  primary: "DejaVuSans"
  secondary: "DejaVuSerif"
  size:
    title: 26
    subtitle: 20
    body: 15
    caption: 13

image_style:
  quality: 95
  width: 1080
  height: 1080
  format: "JPEG"
  watermark: true
  watermark_text: "@VoyageMadagascar"
  watermark_position: "bottom_right"
  watermark_opacity: 0.6

colors:
  primary_text: "#1E3A8A"
  secondary_text: "#3B82F6"
  background: "#F0F9FF"
  highlight: "#F59E0B"

# ============================================
# SOCIAL MEDIA
# ============================================
social:
  facebook:
    enabled: true
    page_id: "VoyageMadagascarOfficial"
    auto_publish: true
    schedule:
      - time: "07:00"
        timezone: "Indian/Antananarivo"
        content_type: "destination_highlight"
      - time: "14:00"
        timezone: "Indian/Antananarivo"
        content_type: "travel_guide"
      - time: "20:00"
        timezone: "Indian/Antananarivo"
        content_type: "travel_tip"

# ============================================
# API CONFIGURATION (MISTRAL + PEXELS ONLY)
# ============================================
api:
  text:
    provider: "mistral"
    model: "mistral-large-latest"
    temperature: 0.8
    max_tokens: 1500
    tone: "inspiring"
    language: "fr"
    
  image:
    provider: "pexels"
    api_key: "PEXELS_API_KEY"
    query_keywords: ["Madagascar travel", "beach", "landscape", "culture", "nature"]
    image_size: "large"

# ============================================
# MISTRAL PROMPTS
# ============================================
mistral_prompts:
  travel_guide:
    system: "Tu es un expert en voyage a Madagascar. Ecris un guide complet et engageant."
    user: "Redige un guide de voyage pour {destination} a Madagascar. Inclus des conseils pratiques, des lieux a visiter, et des informations culturelles. Utilise un ton inspirant et informatif. (Minimum {min_length} caracteres, maximum {max_length} caracteres)"
    
  destination_highlight:
    system: "Tu es un guide touristique specialise dans Madagascar. Decris une destination de maniere captivante."
    user: "Decris {destination} a Madagascar en mettant en avant ses particularites, son histoire et pourquoi les voyageurs devraient la visiter. Sois concis mais percutant."
    
  travel_tip:
    system: "Tu es un voyageur experimenté a Madagascar. Partage un conseil pratique."
    user: "Donne un conseil pratique et utile pour les voyageurs qui visitent Madagascar. Le conseil doit etre court, clair et actionnable."

# ============================================
# PEXELS CONFIG
# ============================================
pexels:
  search:
    per_page: 10
    orientation: "landscape"
    size: "large"
  fallback_keywords: ["travel", "adventure", "nature", "beach"]

# ============================================
# FALLBACK CONFIG
# ============================================
fallback:
  image: "defaults/voyage_default.jpg"
  text: "Decouvrez les merveilles de Madagascar : plages de sable blanc, montagnes majestueuses, et une culture riche et authentique."
  hashtags: ["#VoyageMadagascar", "#Madagascar", "#Voyage"]

# ============================================
# METADATA
# ============================================
metadata:
  version: "1.0.0"
  author: "Nyavo"
  created: "2026-08-23"
  compatible_with: ["OnC v2.0+"]
  api_dependencies: ["mistral", "pexels"]
